name: Sentinel CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -v
      - run: python -m compileall -q sentinel tests
      - run: python -m sentinel audit --json "${RUNNER_TEMP}/sentinel-ci.json"
      - run: python -m sentinel plan --profile raspberry-pi-vpn --json "${RUNNER_TEMP}/sentinel-plan.json"
      - name: Verify tracked checksums
        run: shasum -a 256 -c SHA256SUMS
  ci-success:
    name: Sentinel CI passed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
