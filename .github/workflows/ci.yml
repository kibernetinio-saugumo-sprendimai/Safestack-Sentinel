name: Sentinel CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v
      - run: python -m compileall -q sentinel tests
      - run: python -m sentinel audit --json /tmp/sentinel-ci.json
