name: CodeQL
on:
  push:
  pull_request:
  schedule:
    - cron: '30 3 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    name: Sentinel CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with: {languages: python}
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
